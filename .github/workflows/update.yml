name: Update Adblock List

on:
  schedule:
    # 每天 UTC 16:00（北京时间 00:00）自动重建清单
    - cron: "0 16 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build adblock.list / rewrite.list
        run: python3 build.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain adblock.list rewrite.list)" ]; then
            git add adblock.list rewrite.list
            git commit -m "chore: auto-update adblock.list + rewrite.list [skip ci]"
            git push
          else
            echo "No changes."
          fi
