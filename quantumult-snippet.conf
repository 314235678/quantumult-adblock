# ============================================================
# Quantumult X 配置片段 —— 全部复制，粘贴到配置文件对应段落
# （长按右下角小风车 → 配置文件 → 编辑）
#
# 本片段含两层：
#   ① [rule_remote]  域名拒绝层（无需 MITM，立即生效）—— 我制作的 adblock.list
#   ② [rewrite_remote] 应用内广告深度去除层（需开启 MITM）—— 墨鱼(ddgksf2013) 规则
# ============================================================

# ---------- ① 域名拒绝层：Apple + 全球广告/追踪 + 国产 App 可分离广告域名 ----------
# update-interval 单位秒；86400=每天自动更新。想更"实时"改 3600。
[rule_remote]
https://raw.githubusercontent.com/你的用户名/quantumult-adblock/main/adblock.list, tag=AppleAds, update-interval=86400

# ---------- ② 应用内广告深度去除层（来自 墨鱼 ddgksf2013，需 MITM）----------
# 这些规则能去除微信小程序、微博、B站、网易云、YouTube、Reddit 等 App 内的
# 信息流/开屏/界面广告。它们依赖 HTTPS 解密，必须：
#   - 在 Quantumult X 开启 MITM（小风车 → MitM → 打开）
#   - 在配置 [mitm] 段落的 hostname 里加入对应域名
#   嫌麻烦可直接导入墨鱼完整配置：https://ddgksf2013.top/Profile/QuantumultX.conf
[rewrite_remote]
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/Applet.conf, tag=墨鱼-微信小程序广告, update-interval=86400
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/WeChat.conf, tag=墨鱼-微信公众号(可能失效), update-interval=86400
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/WeiboAds.conf, tag=墨鱼-微博广告, update-interval=86400
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/YoutubeAds.conf, tag=墨鱼-YouTube广告, update-interval=86400
https://raw.githubusercontent.com/ddgksf2013/Rewrite/master/AdBlock/RedditAds.conf, tag=墨鱼-Reddit广告, update-interval=86400
