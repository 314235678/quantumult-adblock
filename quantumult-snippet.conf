# ============================================================
# Quantumult X 去广告配置片段 —— 全部复制，粘贴到配置文件对应段落
# （长按右下角小风车 → 配置文件 → 编辑）
#
# 也可以直接在手机 UI 的「引用」按钮里粘贴下面这两个链接（等效）。
# 本片段只有两条订阅链接：
#   ① [rule_remote]   域名拒绝层（无需 MITM，立即生效）
#   ② [rewrite_remote] 应用内广告深度去除层（来自 墨鱼，需 MitM）
#
# ⚠️ 三个容易踩的坑，先看这里：
#   1) 链接优先用 jsDelivr 镜像（下面就是），国内直连 GitHub raw 经常超时，
#      表现就是「规则一直更新失败」。镜像走全球 CDN，通常秒开。
#      镜像有约 12 小时延迟，介意实时性再换下面注释里的 GitHub 原生链接。
#   2) 只用 App、不关心 Safari 网页广告 → 可以用下面的【精简版】，
#      它剔除了境外网页广告服务器，只留中文 App 的广告域。
#   3) 某个 App 突然「没网」→ 大概率是它的业务域名被拦。
#      去仓库 allowlist.txt 加上主域，下次构建就放行（京东就是这么救回来的）。
# ============================================================

# ---------- ① 域名拒绝层：Apple + 全球广告/追踪 + 国产 App 可分离广告域名 ----------
# 覆盖 Apple / Google / Meta / X(Twitter) / Telegram / 抖音·TikTok·穿山甲 /
# 微信·QQ·广点通 / 百度 / 阿里 + 通用广告&追踪 SDK。代理层 REJECT，无需 MitM。
# update-interval 单位秒；86400=每 24h 自动更新，想更"实时"改 3600。
# 约 2 万条 / 750 KB，这个体量对 QX 完全无压力。
[rule_remote]
https://cdn.jsdelivr.net/gh/314235678/quantumult-adblock@main/adblock.list, tag=去广告域名层, update-interval=86400, enabled=1

# ---------- ①-B 精简版（与上面二选一）----------
# 只含 custom.txt + blackmatrix7，即"中文 App 的广告域"，不含境外网页广告服务器。
# 约 1.7 万条。只用 App、不拦 Safari 网页广告的话选它。
# https://cdn.jsdelivr.net/gh/314235678/quantumult-adblock@main/adblock-lite.list, tag=去广告域名层-精简, update-interval=86400, enabled=1

# ---------- ①-C IP 补充层（默认不用，出问题先取消它）----------
# 裸 IP 广告服务器拦截。单 IP 规则收益低、误伤不可控，且拖慢连接判定。
# https://cdn.jsdelivr.net/gh/314235678/quantumult-adblock@main/adblock-ip.list, tag=去广告IP层, update-interval=86400, enabled=0

# ---------- ② 应用内广告深度去除层（多源合并，需 MitM）----------
# 已合并为【单条链接】，覆盖：微信小程序 / 公众号文章 / 微博 / B站 / 知乎 /
# 网易云 / YouTube / Reddit / 贴吧 / 小红书 / Keep / 闲鱼 / 什么值得买 /
# 高德 / 滴滴 / 美团 / 猫眼 等 App 内的信息流、开屏、界面广告。
# 该清单内自带 hostname 声明，QX 订阅后会【自动】加入 MitM（上限 1200 个域名），
# 无需手动配 [mitm]。
[rewrite_remote]
https://cdn.jsdelivr.net/gh/314235678/quantumult-adblock@main/rewrite.list, tag=应用内去广告, update-interval=86400, enabled=1

# ---------- GitHub 原生链接（镜像不好使时的备选）----------
# https://raw.githubusercontent.com/314235678/quantumult-adblock/main/adblock.list
# https://raw.githubusercontent.com/314235678/quantumult-adblock/main/rewrite.list

# ---------- 使用前提 ----------
# ① 域名层：直接用，无需额外设置。
# ② 应用内层：必须在 Quantumult X 开启 MitM（小风车 → MitM → 打开），
#    并安装并信任 CA 证书（设置里点一下即可）。hostnames 已由 rewrite.list 自动声明。
# 自动更新：GitHub Actions 每天（北京时间 0:00）重建 4 个产物；
#           Quantumult X 按 update-interval 自动拉取，或随时手动点「更新」。
