# ============================================================
# Quantumult X 去广告配置片段 —— 全部复制，粘贴到配置文件对应段落
# （长按右下角小风车 → 配置文件 → 编辑）
#
# 也可以直接在手机 UI 的「引用」按钮里粘贴下面这两个链接（等效）。
# 本片段只有两条订阅链接：
#   ① [rule_remote]   域名拒绝层（无需 MITM，立即生效）
#   ② [rewrite_remote] 应用内广告深度去除层（来自 墨鱼，需 MitM）
# ============================================================

# ---------- ① 域名拒绝层：Apple + 全球广告/追踪 + 国产 App 可分离广告域名 ----------
# 覆盖 Apple / Google / Meta / X(Twitter) / Telegram / 抖音·TikTok·穿山甲 /
# 微信·QQ·广点通 / 百度 / 阿里 + 通用广告&追踪 SDK。代理层 REJECT，无需 MitM。
# update-interval 单位秒；86400=每 24h 自动更新，想更"实时"改 3600。
[rule_remote]
https://raw.githubusercontent.com/314235678/quantumult-adblock/main/adblock.list, tag=去广告域名层, update-interval=86400, enabled=1

# ---------- ② 应用内广告深度去除层（来自 墨鱼 ddgksf2013，需 MitM）----------
# 已合并为【单条链接】，覆盖：微信小程序 / 微博 / B站 / 网易云 / YouTube /
# Reddit / 贴吧 / Keep / 闲鱼 / 什么值得买 / 小宇宙 / 墨迹天气 / 菜鸟 /
# 汽水音乐(字节) / 淘票票 / 高德 / Bing 等 App 内广告。
# 该清单内自带 hostname 声明，QX 订阅后会【自动】加入 MitM，无需手动配 [mitm]。
[rewrite_remote]
https://raw.githubusercontent.com/314235678/quantumult-adblock/main/rewrite.list, tag=墨鱼应用内去广告, update-interval=86400, enabled=1

# ---------- 使用前提 ----------
# ① 域名层：直接用，无需额外设置。
# ② 应用内层：必须在 Quantumult X 开启 MitM（小风车 → MitM → 打开），
#    并安装并信任 CA 证书（设置里点一下即可）。hostnames 已由 rewrite.list 自动声明。
# 自动更新：GitHub Actions 每天（北京时间 0:00）重建 adblock.list / rewrite.list；
#           Quantumult X 按 update-interval 自动拉取，或随时手动点「更新」。
